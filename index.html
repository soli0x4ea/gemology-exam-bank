IC", "NGTC", "FGA"], "diff": "中", "q": "红宝石的红色主要由哪种致色元素引起？", "opts": ["铁(Fe)", "铬(Cr)", "钛(Ti)", "锰(Mn)"], "answer": "B", "exp": "红宝石因 Cr³⁺ 替代 Al³⁺ 致色，呈红色；蓝宝石蓝色由 Fe²⁺–Ti⁴⁺ 电荷转移致色。", "ref": "颜色成因", "q_en": null, "opts_en": null}, {"id": "O04", "cat": "光学与颜色", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列哪些宝石的绿色可由铬(Cr)致色？（多选）", "opts": ["祖母绿", "翡翠", "钙铬榴石", "海蓝宝石"], "answer": ["A", "B", "C"], "exp": "祖母绿、翡翠、钙铬榴石的绿色均源于 Cr³⁺；海蓝宝石的蓝绿色由 Fe²⁺ 致色。", "ref": "颜色成因", "q_en": null, "opts_en": null}, {"id": "O05", "cat": "光学与颜色", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "“变色效应”（亚历山大效应）是指宝石在不同光源下变色，典型宝石是？", "opts": ["变石（金绿宝石）", "猫眼", "碧玺", "尖晶石"], "answer": "A", "exp": "变石（ Alexandrite，金绿宝石变种）在日光下呈绿、白炽灯下呈红紫，源于 Cr³⁺ 的复杂吸收。", "ref": "特殊光学效应", "q_en": null, "opts_en": null}, {"id": "O06", "cat": "光学与颜色", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "“猫眼效应”形成的关键条件是？", "opts": ["宝石含平行排列的针状/管状包裹体或结构", "强多色性", "高折射率", "荧光强"], "answer": "A", "exp": "猫眼效应由平行排列的纤维状/针状包裹体或结构对光的反射形成亮带，关键在“平行定向排列”。", "ref": "特殊光学效应", "q_en": null, "opts_en": null}, {"id": "O07", "cat": "光学与颜色", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列宝石中“色散”最强（火彩最明显）的是？", "opts": ["钻石(0.044)", "立方氧化锆(0.060)", "莫桑石(0.104)", "刚玉(0.018)"], "answer": "C", "exp": "莫桑石（合成碳化硅）色散约 0.104，强于 CZ(0.060) 与钻石(0.044)，因而“火彩”极明显。", "ref": "光学性质", "q_en": null, "opts_en": null}, {"id": "O08", "cat": "光学与颜色", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "星光效应与砂金效应都属于？", "opts": ["猫眼效应", "光彩效应（特殊光学效应）", "变色效应", "变彩效应"], "answer": "B", "exp": "星光、猫眼、变色、变彩、砂金等统称特殊光学效应（光彩效应）；砂金效应由内部定向金属矿物薄片反射所致。", "ref": "特殊光学效应", "q_en": null, "opts_en": null}, {"id": "O09", "cat": "光学与颜色", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "等轴晶系与所有非晶质宝石在偏光镜下均为全暗，无法区分。", "opts": ["对", "错"], "answer": "错", "exp": "等轴晶系与非晶质在偏光镜下虽都呈全暗（各向同性），但折射率、密度、光谱等可区分；且某些等轴晶系晶体可能有异常消光。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "O10", "cat": "光学与颜色", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "欧泊（Opal）的“变彩”效应源于？", "opts": ["金属包裹体反射", "二氧化硅球粒规则排列产生的衍射与干涉", "内部裂隙", "荧光"], "answer": "B", "exp": "欧泊由规则排列的二氧化硅球粒构成，对白光产生衍射与干涉，形成游彩（play-of-color）。", "ref": "特殊光学效应", "q_en": null, "opts_en": null}, {"id": "I01", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "宝石折射仪可测量的折射率范围约为？", "opts": ["1.00–1.50", "1.35–1.81", "1.81–2.50", "无上限"], "answer": "B", "exp": "标准折射仪配合折射油（n≈1.81）可测 RI 1.35–1.81；钻石(2.417)、CZ(2.15)等超出量程无法直接读数。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I02", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "用折射仪点测法（spot reading）常用于测定？", "opts": ["刻面宝石的精确 RI", "弧面宝石、玉石集合体的近似 RI", "密度", "光谱"], "answer": "B", "exp": "点测法（散光法）适用于弧面、不透明或集合体材料（如翡翠、软玉、欧泊），得到近似 RI。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I03", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "偏光镜可用于判断宝石的？", "opts": ["密度", "光性特征（均质/非均质/集合体）", "折射率", "硬度"], "answer": "B", "exp": "偏光镜通过正交偏光下的消光行为判断宝石是均质体、非均质体还是多晶/异常消光。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I04", "cat": "鉴定仪器", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列哪些仪器可用于观察宝石的多色性？（多选）", "opts": ["二色镜", "分光镜", "偏光镜", "显微镜"], "answer": ["A", "C"], "exp": "二色镜直接观察多色性；偏光镜在单偏光下也可辅助判断。分光镜看吸收谱，显微镜看内含物。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I05", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "红宝石在分光镜下典型的吸收光谱特征是？", "opts": ["红区两条铬吸收线(692/694nm)、黄绿区宽吸收带", "仅有蓝区一条线", "全吸收无特征", "红区一条 653nm 线"], "answer": "A", "exp": "红宝石含 Cr，呈红区 692/694nm 双线、黄绿区宽吸收带、蓝紫区吸收，是诊断性光谱。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I06", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "查尔斯滤色镜（Chelsea filter）主要透过哪个波段的光？", "opts": ["蓝光", "红光(>600nm)", "绿光", "全波段"], "answer": "B", "exp": "查尔斯滤色镜主要透过红光（约 600–700nm），阻挡其他波段；用于辅助鉴别铬致色宝石（如祖母绿显红）。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I07", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "用查尔斯滤色镜观察，下列现象符合“天然绿色翡翠 vs 铬盐染色翡翠”区分的是？", "opts": ["两者都变红", "天然绿翡翠仍呈绿色，铬盐染绿翡翠变红", "两者都不变", "天然变红"], "answer": "B", "exp": "天然绿色翡翠在查尔斯滤色镜下一般不变红（仍绿）；铬盐染色的 C 货翡翠因含铬染料常显红色，是经典辅助鉴别点。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I08", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "热导仪能把钻石与下列哪种仿品误判为钻石？", "opts": ["玻璃", "立方氧化锆", "合成碳化硅（莫桑石）", "水晶"], "answer": "C", "exp": "莫桑石导热性高，热导仪会像钻石一样报警；需用电导仪（钻石绝缘、莫桑石导电）或双折射/折射仪进一步区分。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I09", "cat": "鉴定仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "10 倍放大镜（10× loupe）主要用于？", "opts": ["测折射率", "观察宝石内部与外部特征（内含物、表面处理痕迹）", "测密度", "看荧光"], "answer": "B", "exp": "10× 放大镜/宝石显微镜用于观察内含物、结构、表面处理痕迹（如 B 货酸蚀网纹），是肉眼鉴定的核心工具。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "I10", "cat": "鉴定仪器", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "关于分光镜，下列正确的有？（多选）", "opts": ["棱镜式视场较暗但无色散", "衍射光栅式视场亮但谱线有轻微弯曲", "红宝石可见铬谱", "钻石在 415nm 附近有吸收线"], "answer": ["A", "B", "C", "D"], "exp": "棱镜式亮度低但无色差，光栅式亮但有谱线弯曲；红宝石具铬吸收谱；多数钻石在 415.5nm 处有吸收线。", "ref": "常规仪器", "q_en": null, "opts_en": null}, {"id": "D01", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "钻石的折射率约为？", "opts": ["1.50", "1.76", "2.417", "2.15"], "answer": "C", "exp": "钻石 RI≈2.417，色散 0.044，金刚光泽，是天然无色宝石中折射率最高者之一。", "ref": "钻石性质", "q_en": null, "opts_en": null}, {"id": "D02", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "钻石 4C 分级不包括哪一项？", "opts": ["颜色(Color)", "净度(Clarity)", "切工(Cut)", "产地(Origin)"], "answer": "D", "exp": "4C 为颜色、净度、切工、克拉重量；产地不属于 4C 分级要素。", "ref": "钻石分级", "q_en": null, "opts_en": null}, {"id": "D03", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "GIA 颜色分级中，D 色代表？", "opts": ["最黄", "完全无色（最高级别）", "浅黄", "带褐"], "answer": "B", "exp": "D 为颜色分级最高级（完全无色），依次 E、F… 至 Z 渐黄。国标 GB/T 16554 以 100(D) 起计。", "ref": "钻石分级", "q_en": null, "opts_en": null}, {"id": "D04", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "国标 GB/T 16554 钻石净度级别中，LC 表示？", "opts": ["镜下无瑕", "瑕疵级", "微瑕", "极微瑕"], "answer": "A", "exp": "国标净度由高到低：LC(镜下无瑕)、VVS、VS、SI、P(瑕疵)；GIA 对应 FL/IF、VVS、VS、SI、I。", "ref": "钻石分级", "q_en": null, "opts_en": null}, {"id": "D05", "cat": "钻石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "可用于区分钻石与仿制品的方法有？（多选）", "opts": ["热导仪", "折射仪（超量程无读数）", "10× 放大看后刻面棱重影", "静水称重测密度"], "answer": ["A", "B", "D"], "exp": "钻石导热极高→热导仪；RI>1.81→折射仪无读数；SG≈3.52 可测。C 中“后刻面棱重影”是强双折射仿品(莫桑石/CZ)特征，钻石无重影。", "ref": "钻石鉴别", "q_en": null, "opts_en": null}, {"id": "D06", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "合成碳化硅（莫桑石）与钻石的主要区别在于？", "opts": ["莫桑石导热低", "莫桑石为强双折射（后刻面棱重影），钻石为均质体", "莫桑石硬度低于 7", "莫桑石密度 5.8"], "answer": "B", "exp": "莫桑石为六方晶系、强双折射(0.043)，10× 下后刻面棱明显重影；钻石均质体无重影。这是最直观的肉眼/放大区分点。", "ref": "钻石鉴别", "q_en": null, "opts_en": null}, {"id": "D07", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "关于钻石的“处理”方法，下列需明确披露的是？", "opts": ["天然未处理", "激光钻孔、裂隙充填、辐照/HPHT 改色", "切割比例优化", "抛光"], "answer": "B", "exp": "激光钻孔、裂隙充填、辐照或高温高压(HPHT)改色均属处理，必须披露；切割与抛光属正常加工。", "ref": "钻石处理", "q_en": null, "opts_en": null}, {"id": "D08", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "钻石裂隙充填处理在暗域照明下常可见？", "opts": ["蓝色荧光", "特征性的彩色“闪光”（蓝/橙/紫红色）", "全黑", "绿色斑点"], "answer": "B", "exp": "裂隙充填物（如玻璃）在暗域转动观察时，因与钻石折射率差异而在裂隙处呈现特征性蓝/橙/紫红色闪光，是诊断特征。", "ref": "钻石处理", "q_en": null, "opts_en": null}, {"id": "D09", "cat": "钻石", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "钻石具有八面体完全解理，受撞击易沿解理方向破裂。", "opts": ["对", "错"], "answer": "对", "exp": "钻石具四组八面体完全解理，虽极硬但受定向撞击易沿解理裂开，故佩戴与加工需防磕碰。", "ref": "钻石性质", "q_en": null, "opts_en": null}, {"id": "D10", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "立方氧化锆（CZ）作为钻石仿品，其特征不包括？", "opts": ["密度明显高于钻石", "色散强于钻石（火彩更艳）", "均质体、单折射", "硬度 10"], "answer": "D", "exp": "CZ 硬度约 8.5（非 10），密度 5.6–6.0、色散 0.060、均质体，是常见钻石仿品。", "ref": "钻石鉴别", "q_en": null, "opts_en": null}, {"id": "D11", "cat": "钻石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "“克拉溢价”是指？", "opts": ["钻石越大越便宜", "整数克拉（如 1.00ct、2.00ct）界限处价格显著跃升", "颜色越白越贵", "产地的附加价值"], "answer": "B", "exp": "钻石价格在非整数与整数克拉边界存在跃升，如 0.99ct 与 1.00ct 单价差异明显，称克拉溢价。", "ref": "商贸", "q_en": null, "opts_en": null}, {"id": "D12", "cat": "钻石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "关于钻石荧光，下列说法正确的有？（多选）", "opts": ["部分钻石在长波紫外下呈蓝白色荧光", "强荧光可能在某些光线下使钻石显雾（影响价格）", "所有钻石都有强荧光", "荧光在 GIA 证书中单独标注"], "answer": ["A", "B", "D"], "exp": "多数钻石有蓝白荧光（强弱不一），强荧光在部分情况下影响外观与价格；GIA 证书标注荧光强度。并非所有钻石都有强荧光。", "ref": "钻石分级", "q_en": null, "opts_en": null}, {"id": "R01", "cat": "红蓝宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "红宝石与蓝宝石的矿物名称都是？", "opts": ["金绿宝石", "刚玉", "绿柱石", "尖晶石"], "answer": "B", "exp": "红、蓝宝石均属刚玉（Corundum，Al₂O₃），仅因致色元素不同呈现不同颜色。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "R02", "cat": "红蓝宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "天然红宝石典型的内部特征（包裹体）不包括？", "opts": ["金红石针（“丝状物”）", "指纹状气液包裹体", "弧形生长纹与气泡", "锆石包裹体及“锆石晕”"], "answer": "C", "exp": "弧形生长纹与气泡是焰熔法合成红宝石的特征；天然红宝石常见金红石针、指纹状包裹体、锆石晕等。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "R03", "cat": "红蓝宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "焰熔法（Verneuil，维尔纳叶法）合成红宝石最典型的包裹体特征是？", "opts": ["平直生长纹与助熔剂残余", "弧形生长纹与球形气泡", "三相包裹体", "铂金属片"], "answer": "B", "exp": "焰熔法合成红宝石常见弯曲（弧形）生长纹与球形/蝌蚪形气泡，缺乏天然的金红石针。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "R04", "cat": "红蓝宝石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列哪些是刚玉热处理的常见鉴别指示？（多选）", "opts": ["金红石针熔融、丝状物减少", "“锆石晕”（锆石周围应力盘状裂隙）", "色带变模糊", "明显的弧形生长纹"], "answer": ["A", "B", "C"], "exp": "热处理可使金红石针熔断、色带模糊，并因锆石包裹体受热膨胀产生环状“锆石晕”；弧形生长纹是合成特征，非热处理。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "R05", "cat": "红蓝宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "蓝宝石的“铍(Be)扩散处理”最关键的鉴别点是？", "opts": ["颜色整体均匀", "颜色集中在表面/裂隙附近（棱线更深），二碘甲烷浸没可见色环", "无荧光", "密度显著降低"], "answer": "B", "exp": "铍扩散为表面扩散处理，颜色富集于表层与裂隙，浸于二碘甲烷中可见颜色环/棱线更深，是重要鉴别点，且须披露。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "R06", "cat": "红蓝宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "星光红/蓝宝石的星光效应由下列哪种包裹体定向排列形成？", "opts": ["金红石针", "气液两相包体", "磷灰石晶体", "石墨片"], "answer": "A", "exp": "星光刚玉由定向排列的金红石针（沿三个方向）对光反射形成六射星光。", "ref": "特殊光学效应", "q_en": null, "opts_en": null}, {"id": "R07", "cat": "红蓝宝石", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "刚玉中除红色铬致色称为红宝石外，其余所有颜色（蓝、黄、粉、紫等）均称为蓝宝石。", "opts": ["对", "错"], "answer": "对", "exp": "宝石学上红宝石专指铬致色的红色刚玉；其他颜色刚玉统称蓝宝石（如黄色蓝宝石、粉色蓝宝石）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "R08", "cat": "红蓝宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "助熔剂法合成红宝石的典型包裹体是？", "opts": ["球形气泡", "助熔剂残余（面纱状/羽状）与铂金属片", "弧形生长纹", "三相包裹体"], "answer": "B", "exp": "助熔剂法合成红/蓝宝石常见助熔剂残余（面纱状、窗纱状）及铂坩埚脱落的铂金属片（三角形/六边形），可与天然区分。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "B01", "cat": "祖母绿绿柱石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "祖母绿的矿物名称是？", "opts": ["刚玉", "绿柱石", "石榴石", "尖晶石"], "answer": "B", "exp": "祖母绿是绿柱石家族的绿色变种（Cr/V 致色）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "B02", "cat": "祖母绿绿柱石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "天然祖母绿典型的诊断性包裹体是？", "opts": ["弧形生长纹", "三相包裹体（气-液-固）", "球形气泡", "铂金属片"], "answer": "B", "exp": "哥伦比亚等地天然祖母绿常见三相（气-液-固）包裹体，是重要产地/天然指示；合成祖母绿无此特征。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "B03", "cat": "祖母绿绿柱石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "水热法合成祖母绿常见的包裹体是？", "opts": ["助熔剂残余面纱", "钉状（钉头）包裹体与种晶片", "三相包裹体", "金红石针"], "answer": "B", "exp": "水热法（如俄罗斯/吉尔森法）合成祖母绿常见钉状（钉头状）包裹体、种晶片及平行生长纹；助熔剂法才见助熔剂残余。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "B04", "cat": "祖母绿绿柱石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "祖母绿最常见的优化处理是？", "opts": ["染色", "注油（浸油）", "辐照", "镀膜"], "answer": "B", "exp": "祖母绿裂隙发育，注油（雪松油/树脂）是传统且广泛接受的优化，可改善外观；重度树脂充填则属处理须披露。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "B05", "cat": "祖母绿绿柱石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "绿柱石家族除祖母绿外，还包括？（多选）", "opts": ["海蓝宝石", "摩根石（粉色绿柱石）", "金色绿柱石（金绿柱石）", "碧玺"], "answer": ["A", "B", "C"], "exp": "绿柱石家族含祖母绿、海蓝宝石、摩根石、金色绿柱石、红色绿柱石等；碧玺是电气石，非绿柱石。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "B06", "cat": "祖母绿绿柱石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "海蓝宝石的蓝色主要由哪种元素致色？", "opts": ["铬(Cr)", "铁(Fe²⁺)", "钛(Ti)", "钴(Co)"], "answer": "B", "exp": "海蓝宝石因 Fe²⁺ 致色呈蓝绿色；祖母绿因 Cr/V 致色，两者同属绿柱石但致色元素不同。", "ref": "颜色成因", "q_en": null, "opts_en": null}, {"id": "S01", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "尖晶石属于哪个晶系？", "opts": ["三方", "等轴（立方）", "斜方", "单斜"], "answer": "B", "exp": "尖晶石为等轴晶系、均质体，常见红色（铬致色）易与红宝石混淆，但无多色性、为单折射。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S02", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列宝石中属于“单晶质、具强多色性且常含平行管状包裹体形成猫眼”的是？", "opts": ["碧玺（电气石）", "尖晶石", "石榴石", "钻石"], "answer": "A", "exp": "碧玺为一轴晶负光性、强多色性、常见平行管状/线状包裹体，可形成猫眼效应；且受热释电性（摩擦带电）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S03", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "石榴石类宝石的光学性质特征是？", "opts": ["一轴晶负光性", "均质体（等轴晶系），单折射", "二轴晶", "非晶质"], "answer": "B", "exp": "石榴石属等轴晶系、均质体、单折射（各品种 RI 不同），无多色性，是重要鉴别点。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S04", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "橄榄石的绿色主要由哪种元素致色？", "opts": ["铬", "铁(Fe)", "铜", "钴"], "answer": "B", "exp": "橄榄石因 Fe²⁺ 致色呈黄绿色；含铬的钙铁榴石（翠榴石）才由铬致色。", "ref": "颜色成因", "q_en": null, "opts_en": null}, {"id": "S05", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "坦桑石（Tanzanite）的矿物名称是？", "opts": ["黝帘石", "绿帘石", "锂辉石", "方柱石"], "answer": "A", "exp": "坦桑石为蓝色黝帘石（Zoisite），因钒致色，具强三色性（蓝/紫/黄绿），仅产于坦桑尼亚。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S06", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "托帕石（黄玉）的晶系与光性为？", "opts": ["三方一轴晶负", "斜方二轴晶", "等轴均质", "单斜"], "answer": "B", "exp": "托帕石属斜方晶系、二轴晶，常见无色/蓝/粉等；注意与“黄玉”俗称混淆（非软玉）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S07", "cat": "彩色宝石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列具“多色性”的宝石有？（多选）", "opts": ["红宝石", "碧玺", "尖晶石", "坦桑石"], "answer": ["A", "B", "D"], "exp": "红宝石（一轴晶）、碧玺（一轴晶）、坦桑石（二轴晶）均有明显多色性；尖晶石均质体无多色性。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "S08", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "石英族中“紫晶”的紫色成因主要是？", "opts": ["铬致色", "铁(Fe³⁺) + 辐照形成色心", "锰致色", "铜致色"], "answer": "B", "exp": "紫晶由 Fe³⁺ 在辐照下形成色心致色；加热可褪色（变黄/无色），是鉴别与处理要点。", "ref": "颜色成因", "q_en": null, "opts_en": null}, {"id": "S09", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "铬透辉石（俄罗斯查尔西石）与祖母绿易混淆，其主要区分点是？", "opts": ["密度更低(3.2–3.3)、RI 更低、二轴晶、查尔斯滤色镜下不变红", "密度更高、均质体", "有强荧光", "硬度 9"], "answer": "A", "exp": "铬透辉石为单斜/二轴晶、RI≈1.67–1.70、SG≈3.3，查尔斯滤色镜下不变红；祖母绿为六方一轴晶、滤色镜常变红。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S10", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列宝石中韧性相对最好、最不易破损的是？", "opts": ["钻石", "软玉", "月光石（长石）", "玻璃"], "answer": "B", "exp": "软玉（透闪石玉）因毛毡状交织结构韧性极佳；月光石等长石具完全解理、脆性大。", "ref": "力学性质", "q_en": null, "opts_en": null}, {"id": "J01", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "翡翠的主要矿物组成是？", "opts": ["透闪石", "硬玉（绿辉石类）", "蛇纹石", "石英"], "answer": "B", "exp": "翡翠以硬玉（钠铝辉石）为主，呈纤维交织结构；软玉以透闪石-阳起石为主。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J02", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "翡翠（硬玉）与软玉（和田玉）的主要密度差异是？", "opts": ["翡翠约 2.95，软玉约 3.33", "翡翠约 3.33，软玉约 2.95", "两者均为 2.66", "两者均为 4.0"], "answer": "B", "exp": "翡翠密度约 3.33，软玉约 2.95，是快速区分两者的重要依据之一（另可结合 RI：翡翠≈1.66、软玉≈1.61）。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J03", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "国标中“翡翠A货/B货/C货”的含义是？", "opts": ["A=天然，B=酸洗注胶，C=染色", "A=染色，B=天然，C=注胶", "A=合成，B=处理，C=天然", "三者均为合成"], "answer": "A", "exp": "A 货=天然未处理；B 货=酸洗+树脂充填；C 货=染色；B+C 为酸洗注胶+染色。", "ref": "优化处理/标准", "q_en": null, "opts_en": null}, {"id": "J04", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "翡翠 B 货（酸洗注胶）的鉴别特征不包括？", "opts": ["表面酸蚀网纹（沟渠状）", "密度略低于 3.33", "强天然荧光（无胶）", "红外可见有机质吸收"], "answer": "C", "exp": "B 货因注胶在紫外下常有胶的蓝白荧光（而非“强天然荧光、无胶”）；酸蚀网纹、密度降低、红外有机质峰均为特征。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "J05", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "国标 GB/T 16552 对“和田玉”的定名原则是？", "opts": ["仅指新疆和田产出的玉", "指透闪石-阳起石玉的统称，不具产地意义", "仅指白玉", "指所有软玉仿品"], "answer": "B", "exp": "国标将透闪石含量达标的玉定名为“和田玉”，作为矿物学统称，不再限定产地（市场仍常以产地区分品质）。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "J06", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "绿松石的主要化学成分是？", "opts": ["含铜铝磷酸盐", "碳酸盐", "硅酸盐", "氧化物"], "answer": "A", "exp": "绿松石为含水铜铝磷酸盐，因 Cu²⁺ 致天蓝色，常见褐铁矿“铁线”；常见注胶、染色、Zachery 处理。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J07", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "欧泊（Opal）的主要成分是？", "opts": ["SiO₂·nH₂O", "CaCO₃", "Al₂O₃", "C"], "answer": "A", "exp": "欧泊为含水二氧化硅（非晶质），因规则SiO₂球粒排列产生变彩；仿品有玻璃欧泊、合成欧泊（具“蜥蜴皮/镶嵌状”结构）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "J08", "cat": "玉石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "合成欧泊与天然欧泊的区分要点有？（多选）", "opts": ["合成欧泊常具“蜥蜴皮/镶嵌状/蜂窝”变彩结构", "天然欧泊变彩更自然、无规则镶嵌块", "合成欧泊密度明显更高", "紫外荧光完全不同无法区分"], "answer": ["A", "B"], "exp": "合成欧泊具特征性的“蜥蜴皮”或镶嵌状变彩结构、变彩呈规则斑块；天然欧泊变彩更自然。C/D 非主要判别点。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "M01", "cat": "有机宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "珍珠的主要成分包括？", "opts": ["文石（霰石）与贝壳硬蛋白", "二氧化硅", "碳酸钙（方解石）单一", "碳氢化合物"], "answer": "A", "exp": "珍珠由文石（霰石）小板片与贝壳硬蛋白（conchyolin）层层包裹构成，形成珍珠光泽。", "ref": "有机宝石", "q_en": null, "opts_en": null}, {"id": "M02", "cat": "有机宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "区分天然珍珠与养殖珍珠的关键依据是？", "opts": ["颜色", "是否存在珠核（养殖珠有贝壳磨制珠核，珍珠质层较薄）", "大小", "产地"], "answer": "B", "exp": "有核养殖珍珠内部有贝壳磨制的圆形珠核，外围珍珠质层薄；天然珍珠为同心层状、无核；可用 X 射线/内窥镜鉴别。", "ref": "有机宝石", "q_en": null, "opts_en": null}, {"id": "M03", "cat": "有机宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "琥珀在饱和食盐水中的行为是？", "opts": ["下沉", "漂浮", "悬浮不动", "溶解"], "answer": "B", "exp": "琥珀 SG≈1.08，小于饱和食盐水(≈1.2)，故上浮；柯巴树脂(年轻化石)也浮，但更易被溶剂溶解、针挑出丝。", "ref": "有机宝石", "q_en": null, "opts_en": null}, {"id": "M04", "cat": "有机宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "下列可用于区分琥珀与柯巴树脂（年轻树脂）的是？", "opts": ["两者密度完全相同无法区分", "柯巴树脂更软、溶剂（酒精/乙醚）中易发粘/溶解，针挑出丝", "琥珀不发光", "柯巴密度>2.0"], "answer": "B", "exp": "柯巴树脂地质年代短，硬度低、在酒精/乙醚中发粘、针挑可拉出丝；琥珀稳定不易溶。", "ref": "有机宝石", "q_en": null, "opts_en": null}, {"id": "M05", "cat": "有机宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "象牙特有的鉴别结构是？", "opts": ["哈弗氏管（骨管）", "勒兹纹（旋转引擎状交叉纹理）", "同心层", "放射纹"], "answer": "B", "exp": "象牙具特征性的勒兹纹（呈旋转引擎/交叉曲线纹理）；骨骼具哈弗氏管，可据此区分象牙与骨仿品。", "ref": "有机宝石", "q_en": null, "opts_en": null}, {"id": "M06", "cat": "有机宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "红珊瑚（贵珊瑚）的染色处理可用下列哪种方法辅助鉴别？", "opts": ["折射仪", "丙酮/酒精棉擦拭看是否掉色、观察颜色在裂隙/孔隙集中", "测密度", "X 射线"], "answer": "B", "exp": "染色珊瑚常颜色沿裂隙/孔隙集中，丙酮或酒精棉擦拭可能掉色；天然色分布较自然。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "M07", "cat": "有机宝石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "属于有机宝石的有？（多选）", "opts": ["珍珠", "珊瑚", "琥珀", "翡翠"], "answer": ["A", "B", "C"], "exp": "珍珠、珊瑚、琥珀、象牙、煤精、龟甲等均属有机宝石（生物成因）；翡翠为无机玉石。", "ref": "有机宝石", "q_en": null, "opts_en": null}, {"id": "M08", "cat": "有机宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "关于珍珠的“辐照处理”，下列说法正确的是？", "opts": ["辐照可使珍珠产生稳定的天然色", "辐照常使珍珠呈灰/黑等色，属处理须披露", "辐照增加珍珠光泽", "辐照是优化不需披露"], "answer": "B", "exp": "辐照改色（多见黑/灰珠）属处理，须披露；其颜色来自辐射诱导的有机质变化，并非天然色。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "SY01", "cat": "合成宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列合成方法中，焰熔法（Verneuil）常用于生产？", "opts": ["合成祖母绿（水热/助熔）", "合成红/蓝宝石、合成尖晶石、合成金红石", "合成钻石（CVD）", "合成欧泊"], "answer": "B", "exp": "焰熔法用于合成刚玉（红蓝宝石）、尖晶石、金红石、星光合成刚玉等；祖母绿多用助熔/水热；钻石用 HPHT/CVD。", "ref": "合成方法", "q_en": null, "opts_en": null}, {"id": "SY02", "cat": "合成宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "CVD 法合成钻石的典型特征是？", "opts": ["黄色、含金属包裹体", "褐色/近无色、平行层面生长纹、点状/石墨包体、强荧光", "弧形生长纹", "球形气泡"], "answer": "B", "exp": "CVD（化学气相沉积）合成钻石多为褐/近无色，具平行生长层纹、点状或石墨包体、常显强荧光；HPHT 合成钻石多黄/橙、含金属包体（有磁性）。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "SY03", "cat": "合成宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "HPHT 法合成钻石的典型特征是？", "opts": ["平行生长纹、无色", "黄色/橙色、含金属包裹体（有磁性）、异常消光/强磷光", "弧形生长纹", "三相包裹体"], "answer": "B", "exp": "HPHT（高温高压）合成钻石常呈黄/橙黄色，含金属触媒包裹体（具磁性）、异常双折射、强磷光，可与天然区分。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "SY04", "cat": "合成宝石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "合成宝石与天然宝石在定名上的区别是？（多选）", "opts": ["合成宝石必须在名称前加“合成”二字", "合成宝石可不加任何前缀当天然卖", "拼合宝石需标明“拼合”", "人造宝石（如 YAG）须冠以“人造”"], "answer": ["A", "C", "D"], "exp": "按标准，合成宝石须冠“合成”（如“合成红宝石”），拼合石须标“拼合”，人造宝石须标“人造”；冒充天然属欺诈。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "SY05", "cat": "合成宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "助熔剂法合成祖母绿（如查塔姆法）的典型包裹体是？", "opts": ["钉状包裹体", "面纱状助熔剂残余与铂金属片", "弧形生长纹", "三相包裹体"], "answer": "B", "exp": "助熔剂法（查塔姆等）合成祖母绿常见面纱状/羽状助熔剂残余及铂金属片；水热法才见钉状包裹体。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "SY06", "cat": "合成宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "水热法合成水晶（紫晶/黄晶）与天然水晶的主要区别常在于？", "opts": ["合成品无包裹体、颜色均匀且常沿种晶片分布", "合成品密度更高", "合成品为均质体", "合成品无解理"], "answer": "A", "exp": "水热法合成水晶颜色均匀、常见种晶片、包裹体少且特征不同（如面包渣状包裹体），可据此与天然区分。", "ref": "合成宝石", "q_en": null, "opts_en": null}, {"id": "SY07", "cat": "合成宝石", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "合成宝石在化学成分、晶体结构、物理性质上与对应天然宝石基本一致，但生长环境不同。", "opts": ["对", "错"], "answer": "对", "exp": "合成宝石是人工制造的“真宝石材料”（成分结构同天然），与仿制品（如玻璃仿红宝石）本质不同。", "ref": "合成宝石概念", "q_en": null, "opts_en": null}, {"id": "SY08", "cat": "合成宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "“仿制宝石（imitations/simulants）”是指？", "opts": ["人工合成的天然对应物", "用于模仿某宝石外观但成分/结构不同的材料（如玻璃、CZ 仿钻）", "天然处理的宝石", "拼合石"], "answer": "B", "exp": "仿制品（simulant）只求外观相似，成分结构可完全不同（如玻璃仿祖母绿、CZ 仿钻石）；与合成宝石概念不同。", "ref": "概念", "q_en": null, "opts_en": null}, {"id": "T01", "cat": "优化处理", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "按国标，下列哪项属于“处理”（须披露），而非“优化”？", "opts": ["传统可接受的热处理", "染色", "轻微漂白", "浸蜡"], "answer": "B", "exp": "国标中染色、充填、扩散、覆膜、辐照、激光钻孔等属“处理”，定名须注明（如“翡翠(处理)”）；热处理、浸蜡、轻微漂白多归“优化”可不注。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "T02", "cat": "优化处理", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "红宝石“扩散处理”（表面扩散）的鉴别要点是？", "opts": ["颜色均匀深入内部", "颜色集中于表面/棱线，二碘甲烷中可见色环", "无荧光", "密度减半"], "answer": "B", "exp": "扩散处理颜色富集于表层与棱线，浸二碘甲烷可见色环；属处理须披露。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "T03", "cat": "优化处理", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列属于宝石“优化”（通常无需特别披露）的有？（多选）", "opts": ["热处理（传统改色）", "浸蜡", "轻微漂白", "染色"], "answer": ["A", "B", "C"], "exp": "热处理、浸蜡、轻微漂白一般归“优化”，定名可不注明；染色属“处理”须披露。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "T04", "cat": "优化处理", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "翡翠“抛光粉致色/镀膜”等属于？", "opts": ["优化", "处理（须披露）", "天然成因", "产地特征"], "answer": "B", "exp": "镀膜、抛光粉着色等改变外观且非天然，属处理，须披露；否则构成以次充好。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "T05", "cat": "优化处理", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "碧玺常见“充胶”处理，其主要目的是？", "opts": ["改色", "掩盖裂隙、改善透明度与稳定性", "增加重量", "提高硬度"], "answer": "B", "exp": "碧玺多裂隙，充胶（注胶）可掩盖裂隙、提升净度与加工性，属处理须披露；显微镜下可见胶的荧光与气泡。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "T06", "cat": "优化处理", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "琥珀“压制（压固）处理”的鉴别特征是？", "opts": ["完全无结构", "可见未熔融颗粒与“血丝状”流动构造", "密度>2.0", "不发光"], "answer": "B", "exp": "压制琥珀由碎琥珀熔融压固而成，可见未完全熔融的颗粒边界与血丝状（流纹）构造，是典型鉴别点。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "T07", "cat": "优化处理", "type": "judge", "exams": ["GIC", "NGTC"], "diff": "中", "q": "按国标，经过“处理”的珠宝玉石在证书与定名中必须明示处理方法或标注“处理”字样。", "opts": ["对", "错"], "answer": "对", "exp": "GB/T 16552/16553 要求处理宝石须披露，如“翡翠（漂白、充填）”“蓝宝石（扩散）”等，保障消费者知情权。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "T08", "cat": "优化处理", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "下列“处理”中，主要用以改善净度的是？", "opts": ["热处理致色", "祖母绿注油/树脂充填、钻石裂隙充填", "染色", "扩散"], "answer": "B", "exp": "注油/树脂充填（祖母绿）与裂隙充填（钻石）主要为掩盖裂隙、改善净度与外观；热处理/染色/扩散多为改色。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "T09", "cat": "优化处理", "type": "multiple", "exams": ["GIC", "NGTC"], "diff": "中", "q": "关于钻石处理，须披露的有？（多选）", "opts": ["激光钻孔", "裂隙充填", "辐照/HPHT 改色", "标准切割比例"], "answer": ["A", "B", "C"], "exp": "激光钻孔、裂隙充填、辐照或 HPHT 改色均属处理须披露；切割比例是加工参数，非处理。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "T10", "cat": "优化处理", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "珍珠常见的“优化”不包括？", "opts": ["漂白", "增白/抛光", "染色（黑珠处理）", "雕刻成型"], "answer": "D", "exp": "漂白、增白、染色（如黑珍珠处理）均为珍珠常见优化/处理；雕刻是成形工艺，非优化。", "ref": "优化处理", "q_en": null, "opts_en": null}, {"id": "N01", "cat": "标准与商贸", "type": "single", "exams": ["GIC", "NGTC"], "diff": "易", "q": "我国现行珠宝玉石基础国家标准是？", "opts": ["GB/T 16552（名称）、16553（鉴定）、16554（钻石分级）", "GB/T 18888", "ISO 9001", "GB/T 10000"], "answer": "A", "exp": "珠宝玉石三项核心国标：GB/T 16552《珠宝玉石 名称》、GB/T 16553《珠宝玉石 鉴定》、GB/T 16554《钻石分级》。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "N02", "cat": "标准与商贸", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "按 GB/T 16552 定名规则，天然红色刚玉应定名为？", "opts": ["红宝石", "红色刚玉", "粉红色蓝宝石", "合成红宝石"], "answer": "A", "exp": "天然红色刚玉直接定名“红宝石”；蓝色刚玉称“蓝宝石”，其它色称“XX 蓝宝石”（如黄色蓝宝石）。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "N03", "cat": "标准与商贸", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "珠宝玉石分类中，下列哪项不属于“天然珠宝玉石”？", "opts": ["天然宝石", "天然玉石", "天然有机宝石", "合成宝石"], "answer": "D", "exp": "珠宝玉石分为天然珠宝玉石（天然宝石/玉石/有机）与人工珠宝玉石（合成、人造、拼合、仿制）；合成宝石属人工。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "N04", "cat": "标准与商贸", "type": "multiple", "exams": ["GIC", "NGTC"], "diff": "中", "q": "出具珠宝鉴定证书时，以下哪些信息通常须包含？（多选）", "opts": ["样品名称（定名）", "质量（重量）", "颜色/净度/切工等分级（如适用）", "鉴定结果与签名/机构"], "answer": ["A", "B", "C", "D"], "exp": "规范证书应包含：准确定名、质量、关键分级参数（颜色/净度/切工/尺寸）、处理方法（如有）、检验依据、签名与机构。", "ref": "商贸/标准", "q_en": null, "opts_en": null}, {"id": "N05", "cat": "标准与商贸", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "国际权威钻石分级证书机构中，最早建立 4C 体系的是？", "opts": ["GIA（美国宝石学院）", "IGI", "HRD", "NGTC"], "answer": "A", "exp": "GIA 在 20 世纪中期建立并推广钻石 4C 分级体系，是行业广泛采用的国际标准。", "ref": "商贸", "q_en": null, "opts_en": null}, {"id": "N06", "cat": "标准与商贸", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "关于“克拉溢价”与“产地溢价”，下列说法正确的是？", "opts": ["只有钻石有克拉溢价", "优质产地（如缅甸鸽血红、克什米尔蓝）可形成显著产地溢价", "产地不影响价格", "证书不记录产地"], "answer": "B", "exp": "钻石有克拉溢价；名贵宝石（红蓝宝石、祖母绿等）的传奇产地（缅甸、克什米尔、哥伦比亚等）可带来显著产地溢价；高档证书常附注产地。", "ref": "商贸", "q_en": null, "opts_en": null}, {"id": "F01", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "Which crystal system does diamond (corundum's harder cousin) belong to?", "opts": ["Hexagonal", "Cubic (Isometric)", "Orthorhombic", "Triclinic"], "answer": "B", "exp": "Diamond crystallises in the cubic (isometric) system. (Note: ruby/sapphire is corundum, trigonal; diamond is cubic.)", "ref": "Gem-A Foundation: Materials & Structure", "q_en": "Diamond crystallises in the cubic (isometric) crystal system.", "opts_en": null}, {"id": "F02", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "A refractive index reading of '2.417' indicates which gem?", "opts": ["Cubic zirconia", "Diamond", "Quartz", "Topaz"], "answer": "B", "exp": "Diamond has a refractive index of about 2.417 and is isotropic (singly refractive). A standard refractometer cannot read above ~1.81, so diamond gives no direct reading.", "ref": "Gem-A Foundation: Light & Optics / Instruments", "q_en": null, "opts_en": null}, {"id": "F03", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "Curved striae and gas bubbles are characteristic of which synthesis method?", "opts": ["Hydrothermal", "Flux", "Flame fusion (Verneuil)", "CVD"], "answer": "C", "exp": "Flame-fusion (Verneuil) synthetics typically show curved growth striae and rounded gas bubbles, unlike the angular/straight features of natural material.", "ref": "Gem-A Foundation: Synthetics & Imitations", "q_en": null, "opts_en": null}, {"id": "F04", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "Which property best separates natural pearl from cultured pearl?", "opts": ["Colour", "Presence of a bead nucleus in cultured pearls", "Carat weight", "Country of origin"], "answer": "B", "exp": "Cultured pearls contain a bead nucleus (usually a polished shell bead) with a relatively thin nacreous layer; natural pearls are solid nacre (concentric layers) with no nucleus.", "ref": "Gem-A Foundation: Organic gems", "q_en": null, "opts_en": null}, {"id": "F05", "cat": "FGA英文专项", "type": "multiple", "exams": ["FGA"], "diff": "中", "q": "Which of the following are isotropic (singly refractive)? (Select all that apply)", "opts": ["Garnet", "Spinel", "Ruby", "Diamond"], "answer": ["A", "B", "D"], "exp": "Garnet and spinel (cubic) and diamond (cubic) are isotropic; ruby (corundum, trigonal) is anisotropic (uniaxial).", "ref": "Gem-A Foundation: Light & Optics", "q_en": null, "opts_en": null}, {"id": "F06", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "What causes the red colour of ruby?", "opts": ["Iron", "Chromium (Cr³⁺)", "Titanium", "Manganese"], "answer": "B", "exp": "Ruby's red colour is caused by trace chromium (Cr³⁺) substituting for aluminium in the corundum lattice.", "ref": "Gem-A Foundation: Colour", "q_en": null, "opts_en": null}, {"id": "F07", "cat": "FGA英文专项", "type": "judge", "exams": ["FGA"], "diff": "易", "q": "The Mohs scale is an absolute measure of hardness (e.g. corundum is exactly 9 times harder than talc).", "opts": ["True", "False"], "answer": "B", "exp": "The Mohs scale is a relative ordinal scale based on scratch resistance, not an absolute or proportional measure of hardness.", "ref": "Gem-A Foundation: Durability", "q_en": null, "opts_en": null}, {"id": "F08", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "The 'play-of-colour' of opal is caused by?", "opts": ["Metallic inclusions", "Diffraction from regularly packed silica spheres", "Cleavage planes", "Fluorescence"], "answer": "B", "exp": "Opal's play-of-colour results from the diffraction and interference of light by a regular array of silica spheres of sub-micron size.", "ref": "Gem-A Foundation: Materials & Structure", "q_en": null, "opts_en": null}, {"id": "F09", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "难", "q": "A green sapphire and an emerald can be separated primarily by which test?", "opts": ["Both are isotropic", "Sapphire is uniaxial (corundum, RI ~1.76–1.77); emerald is uniaxial beryl (RI ~1.58–1.60) and lower density", "Both have the same RI", "Neither shows colour"], "answer": "B", "exp": "Both are uniaxial, but sapphire (corundum) has RI ~1.762–1.770 and SG ~4.00, whereas emerald (beryl) has RI ~1.577–1.583 and SG ~2.72 — easily separated by RI/SG.", "ref": "Gem-A Foundation: Gemstones", "q_en": null, "opts_en": null}, {"id": "F10", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "Which instrument uses polarised light to determine if a gem is isotropic, anisotropic, or aggregate?", "opts": ["Refractometer", "Polariscope", "Spectroscope", "Chelsea filter"], "answer": "B", "exp": "The polariscope uses crossed polars to reveal optic character: isotropic gems remain dark, anisotropic gems show extinction, aggregates show erratic/aggregate response.", "ref": "Gem-A Foundation: Instruments", "q_en": null, "opts_en": null}, {"id": "F11", "cat": "FGA英文专项", "type": "multiple", "exams": ["FGA"], "diff": "中", "q": "Signs that a ruby may be heat-treated include: (Select all that apply)", "opts": ["Silk (rutile needles) partially melted/absent", "Zircon halos (tension rings around zircon inclusions)", "Curved growth striae", "Blurred colour zoning"], "answer": ["A", "B", "D"], "exp": "Heat treatment can melt/fuse rutile silk, blur colour zoning, and create zircon-halo stress fractures. Curved striae indicate synthesis, not treatment.", "ref": "Gem-A Foundation: Treatments", "q_en": null, "opts_en": null}, {"id": "F12", "cat": "FGA英文专项", "type": "single", "exams": ["FGA"], "diff": "中", "q": "Moissanite (synthetic SiC) is distinguished from diamond mainly by its?", "opts": ["Lower thermal conductivity only", "Strong birefringence causing doubled facet edges under 10×", "Red fluorescence", "Cubic crystal system"], "answer": "B", "exp": "Moissanite is strongly doubly refractive (0.043); under 10× loupe the back facet edges appear doubled. Diamond is isotropic with no doubling. (Moissanite also conducts heat, fooling a thermal tester.)", "ref": "Gem-A Foundation: Synthetics & Imitations", "q_en": null, "opts_en": null}, {"id": "SA01", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC"], "diff": "难", "q": "简述区分天然红宝石与合成红宝石（焰熔法 / 助熔剂法 / 水热法）的主要鉴定要点。", "opts": null, "answer": "1）内含物：天然红宝石常见金红石针（丝状物）、指纹状气液包体、锆石包裹体及“锆石晕”、角状色带；焰熔法见弧形生长纹+球形/蝌蚪形气泡；助熔剂法见面纱状/羽状助熔剂残余及铂金属片；水热法见钉状（钉头）包体与种晶片。2）仪器：显微镜+10×观察为主，配合偏光（合成可能异常消光）、分光镜（天然铬谱）。3）密度与折射率相近，须综合包裹体+仪器判定，必要时上大型仪器（拉曼/红外）。", "exp": "《系统宝石学》合成宝石鉴别", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA02", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC"], "diff": "中", "q": "简述翡翠 A/B/C 货的定义，并列出 B 货的主要鉴别要点。", "opts": null, "answer": "定义：A 货=天然未处理；B 货=强酸漂洗+环氧树脂充填；C 货=染色；B+C=酸洗注胶+染色。\nB 货鉴别：①表面酸蚀网纹（沟渠状/橘皮）；②结构松散、翠性减弱；③密度<3.33、折射率略低；④紫外灯下充填胶显蓝白荧光；⑤红外光谱见有机物吸收峰。", "exp": "GB/T 16552/16553、翡翠鉴定", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA03", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "钻石 4C 指什么？简述切工（Cut）对钻石价值的影响。", "opts": null, "answer": "4C=颜色(Color)、净度(Clarity)、切工(Cut)、克拉重量(Carat)。切工决定光线在钻石内部的折射与反射路径，影响亮度(Brightness)、火彩(Dispersion)与闪烁(Scintillation)；比例、对称性、抛光任一不佳都会漏光、降低美观与价值，优质切工可显著溢价。", "exp": "钻石分级 GB/T 16554 / GIA", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA04", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "如何用常规仪器区分钻石与合成碳化硅（莫桑石）？", "opts": null, "answer": "1）双折射：莫桑石为六方晶系、强双折射(0.043)，10×放大下后刻面棱明显重影；钻石均质体无重影（最直观）。2）热导仪两者均报警（莫桑石导热高），需电导仪区分（钻石绝缘、莫桑石导电），或折射仪（钻石>1.81无读数，莫桑石≈2.65–2.69）。3）重液：莫桑石 SG≈3.22 在二碘甲烷(3.32)中上浮，钻石下沉。", "exp": "钻石鉴别", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA05", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC"], "diff": "中", "q": "简述国标 GB/T 16552 对珠宝玉石定名的基本要求（天然、合成、人造、拼合、处理）。", "opts": null, "answer": "①天然宝石以矿物名称定名（如“红宝石”“翡翠”）；②合成宝石须冠“合成”（如“合成红宝石”）；③人造宝石须冠“人造”（如“人造钇铝榴石”）；④拼合宝石须标“拼合”（如“拼合欧泊”）；⑤经处理的宝石须注明“处理”或具体方法（如“翡翠（漂白、充填）”“蓝宝石（扩散）”）；⑥优化（如热处理、浸蜡）通常可不注明。", "exp": "GB/T 16552 名称", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA06", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC"], "diff": "中", "q": "简述祖母绿注油（浸油）与重度充填处理的鉴别方法。", "opts": null, "answer": "注油：①显微镜下裂隙中可见油、流动构造或气泡；②热针靠近裂隙可渗出油并带气味；③紫外灯下油常呈黄色荧光；④红外/拉曼可检有机成分。重度树脂充填属“处理”须披露，红外见明显有机物吸收峰，与天然区别显著。", "exp": "优化处理", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA07", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "简述天然珍珠与养殖珍珠的区分要点。", "opts": null, "answer": "①有核养殖珍珠内部有贝壳磨制的圆形珠核，外覆薄珍珠质层；天然珍珠为全珍珠质同心层、无核。②X 射线照相：养殖珠显珠核影与同心珍珠质层；天然珠无核。③内窥镜观察钻孔处可见珠核与珍珠质界限。④荧光、生长纹与钻孔特征辅助判断。", "exp": "有机宝石", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA08", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "欧泊“变彩”（play-of-colour）的成因是什么？如何与合成欧泊区分？", "opts": null, "answer": "成因：欧泊由粒径相近、规则排列的二氧化硅球粒构成，对白光产生衍射与干涉，形成随角度游动的彩色（变彩）。\n与合成欧泊区分：合成欧泊具特征性的“蜥蜴皮/镶嵌状/蜂窝”变彩结构、变彩呈规则斑块且边界清晰；天然欧泊变彩更自然、无规则镶嵌块；结合密度、结构观察可辅助判定。", "exp": "玉石/欧泊", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA09", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC"], "diff": "中", "q": "一份规范的珠宝鉴定证书通常应包含哪些内容？", "opts": null, "answer": "①样品定名（符合国标）；②质量（重量，ct/g）；③颜色、净度、切工等分级（适用时）；④尺寸；⑤处理方法（如有）；⑥鉴定结论；⑦检验依据标准（如 GB/T 16553）；⑧检测人/审核人签名与机构；⑨证书编号与日期。", "exp": "商贸/标准", "ref": null, "q_en": null, "opts_en": null}, {"id": "L01", "cat": "光泽", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "下列宝石中呈现“金刚光泽”的是？", "opts": ["钻石", "软玉", "石英", "琥珀"], "answer": "A", "exp": "金刚光泽出现在折射率明显高于约1.8的宝石，以钻石(RI 2.417)最典型；软玉呈油脂光泽、石英玻璃光泽、琥珀树脂光泽。", "ref": "《系统宝石学》光泽", "q_en": null, "opts_en": null}, {"id": "L02", "cat": "光泽", "type": "single", "exams": ["GIC", "NGTC"], "diff": "易", "q": "软玉（和田玉）断口与表面常呈现下列哪种光泽？", "opts": ["玻璃光泽", "油脂光泽", "金属光泽", "珍珠光泽"], "answer": "B", "exp": "软玉因纤维交织结构常显油脂光泽（典型“羊脂”感）；石英贝壳状断口也偶见油脂光泽。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "L03", "cat": "光泽", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列哪些可呈现“丝绢光泽”？（多选）", "opts": ["虎睛石（硅化石棉）", "木变石", "纤维状石棉", "珍珠"], "answer": ["A", "B", "C"], "exp": "丝绢光泽见于平行纤维状/针状集合体（虎睛石、木变石均为硅化石棉，石棉本身丝绢光泽）；珍珠为珍珠光泽。", "ref": "光泽", "q_en": null, "opts_en": null}, {"id": "L04", "cat": "光泽", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "琥珀典型的光泽是？", "opts": ["树脂光泽", "玻璃光泽", "金刚光泽", "油脂光泽"], "answer": "A", "exp": "琥珀（化石树脂）呈树脂光泽；珊瑚也常归树脂光泽。", "ref": "有机宝石", "q_en": null, "opts_en": null}, {"id": "L05", "cat": "光泽", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "宝石学中“金刚光泽”与“亚金刚光泽”的划分主要依据？", "opts": ["折射率（RI 明显高于约1.8 多为金刚/亚金刚光泽）", "硬度", "颜色", "密度"], "answer": "A", "exp": "高 RI 宝石呈金刚光泽（如钻石），介于玻璃与金刚之间称亚金刚光泽（如锆石、CZ 约1.8–2.1）。光泽与 RI 相关性最强。", "ref": "光学性质", "q_en": null, "opts_en": null}, {"id": "L06", "cat": "光泽", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "玻璃光泽是最常见的光泽类型，大多数透明至半透明的中低折射率宝石（如石英、绿柱石）属玻璃光泽。", "opts": ["对", "错"], "answer": "对", "exp": "玻璃光泽（vitreous）对应 RI 约1.5–1.7 的多数宝石，是宝石中最普遍的光泽。", "ref": "光泽", "q_en": null, "opts_en": null}, {"id": "J09", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "易", "q": "软玉的主要矿物组成是？", "opts": ["透闪石-阳起石（角闪石族）", "硬玉", "蛇纹石", "斜长石"], "answer": "A", "exp": "软玉为透闪石-阳起石集合体（角闪石族），纤维交织结构、韧性极佳；翡翠才是硬玉。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J10", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "岫玉（蛇纹石玉）的显著鉴别特征是？", "opts": ["密度约2.57、硬度较低(2.5–5.5)、蜡状光泽", "密度3.33、硬度7", "硬度9、金刚光泽", "均质体"], "answer": "A", "exp": "岫玉为蛇纹石玉，密度约2.57、硬度低（2.5–5.5）、蜡状-油脂光泽、常见黄绿；可与翡翠(3.33)区分。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J11", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "下列可区分“阿富汗玉”（大理石玉）与软玉的是？", "opts": ["阿富汗玉为碳酸盐（方解石）、硬度低(约3)、遇稀盐酸起泡", "密度更高", "具翠性", "折射率2.0"], "answer": "A", "exp": "阿富汗玉是大理石（方解石），硬度约3、遇盐酸起泡；软玉为硅酸盐、硬度6–6.5、不起泡。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J12", "cat": "玉石", "type": "multiple", "exams": ["GIC", "NGTC"], "diff": "中", "q": "关于石英质玉石，下列说法正确的有？（多选）", "opts": ["玛瑙/玉髓为隐晶质石英（SiO₂）", "马来玉多为染色石英岩", "东陵石因含铬云母显砂金效应", "密度约2.66、硬度7"], "answer": ["A", "B", "C", "D"], "exp": "石英质玉（玛瑙、玉髓、马来玉=染色石英岩、东陵石含铬云母砂金）均为 SiO₂，密度约2.66、硬度7，可与翡翠(3.33)区分。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J13", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "青金石（Lapis lazuli）的特征不包括？", "opts": ["含黄铁矿呈金色斑点", "含方解石呈白色脉", "深蓝色（致色为 S²⁻）", "密度约4.5、硬度9"], "answer": "D", "exp": "青金石密度2.7–2.9、硬度5–6；含黄铁矿(金)、方解石(白)与深蓝青金石，致色来自 S³⁻/S²⁻。D 数值明显错误。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J14", "cat": "玉石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "孔雀石（Malachite）区别于绿松石的关键点是？", "opts": ["孔雀石为铜碳酸盐、密度更大(约3.9–4.0)、显同心条带", "孔雀石密度更低", "孔雀石为磷酸盐", "孔雀石无解理"], "answer": "A", "exp": "孔雀石 Cu₂CO₃(OH)₂，密度3.9–4.0（较重）、同心/放射状条带；绿松石为含铜铝磷酸盐、密度2.6–2.9。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "J15", "cat": "玉石", "type": "judge", "exams": ["GIC", "NGTC"], "diff": "中", "q": "独山玉属于斜长石类（钙长石-黝帘石）玉石，以色彩混杂、粒状结构为特征，常与翡翠混淆。", "opts": ["对", "错"], "answer": "对", "exp": "独山玉（河南南阳）为斜长石-黝帘石质玉，色杂（绿白紫等）、粒状结构，密度约2.7–3.1、RI 1.56–1.70，需与翡翠区分。", "ref": "玉石学", "q_en": null, "opts_en": null}, {"id": "DB01", "cat": "拼合石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "“拼合石”（双层石/三层石）是指？", "opts": ["由两层或三层不同材料粘合仿制宝石", "天然孪晶", "合成宝石", "处理宝石"], "answer": "A", "exp": "拼合石用薄层贵材料+廉价基底/顶盖粘合（如拼合欧泊、拼合祖母绿），以省料仿高档宝石。", "ref": "概念/标准", "q_en": null, "opts_en": null}, {"id": "DB02", "cat": "拼合石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "拼合欧泊（opal doublet）的典型结构是？", "opts": ["薄片欧泊+深色基底（常再加透明顶盖成三层石）", "单一整块欧泊", "玻璃仿欧泊", "合成欧泊"], "answer": "A", "exp": "拼合欧泊：顶层薄欧泊 + 黑玛瑙/黑玻璃基底（三层石再加透明石英/玻璃顶），仿黑欧泊外观。", "ref": "拼合石", "q_en": null, "opts_en": null}, {"id": "DB03", "cat": "拼合石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "鉴别拼合石最有效的方法之一是？", "opts": ["从侧面/腰围观察结合缝与胶层（浸二碘甲烷更明显）", "测硬度", "称重", "看颜色"], "answer": "A", "exp": "拼合石在腰围/侧面可见结合缝、胶层（不同 RI 分界），浸入二碘甲烷因各部分 RI 差异使结合面清晰可见；必要时大型仪器确认。", "ref": "拼合石", "q_en": null, "opts_en": null}, {"id": "DB04", "cat": "拼合石", "type": "judge", "exams": ["GIC", "NGTC"], "diff": "易", "q": "拼合石在定名时必须标明“拼合”（如“拼合欧泊”），否则冒充天然单晶宝石属欺诈。", "opts": ["对", "错"], "answer": "对", "exp": "GB/T 16552 要求拼合石须标注“拼合”及组成材料，隐瞒即构成以假充真。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "AR01", "cat": "人造宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "按国标，“人造宝石”是指？", "opts": ["人工制造、自然界无已知对应天然宝石的材料（如 CZ、YAG、GGG）", "有天然对应物的合成品", "天然处理品", "拼合石"], "answer": "A", "exp": "人造宝石（如立方氧化锆、钇铝榴石、钆镓榴石、钛酸锶）自然界无对应天然宝石；而有天然对应物的（如合成红宝石）称合成宝石。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "AR02", "cat": "人造宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列钻石仿品中色散最强、火彩最明显的是？", "opts": ["钛酸锶（RI≈2.41，色散约0.19）", "钻石", "立方氧化锆", "玻璃"], "answer": "A", "exp": "钛酸锶色散约0.19（远高于 CZ 0.060、钻石0.044），火彩极艳，曾称“神石”作钻石仿品；但硬度低(5.5)。", "ref": "仿制宝石", "q_en": null, "opts_en": null}, {"id": "AR03", "cat": "人造宝石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列属于“人造宝石”（非合成宝石）的有？（多选）", "opts": ["立方氧化锆(CZ)", "钇铝榴石(YAG)", "钆镓榴石(GGG)", "合成红宝石"], "answer": ["A", "B", "C"], "exp": "CZ、YAG、GGG 自然界无对应天然宝石→人造宝石；合成红宝石有天然对应物→合成宝石。", "ref": "标准", "q_en": null, "opts_en": null}, {"id": "AR04", "cat": "人造宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "钇铝榴石（YAG）作为钻石仿品的特点是？", "opts": ["立方晶系、均质体、RI≈1.833、硬度约8", "强双折射", "密度极低", "非晶质"], "answer": "A", "exp": "YAG 为立方晶系、单折射（均质）、RI 1.833、硬度8，曾作钻石仿品；因色散低(0.028)火彩不如钻石。", "ref": "仿制宝石", "q_en": null, "opts_en": null}, {"id": "AR05", "cat": "人造宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "销售合成立方氧化锆(CZ)时，正确的做法是？", "opts": ["明确标注为人工制造（如“人造立方氧化锆”/“合成氧化锆”），不得冒称天然钻石", "直接称“锆石”当天然卖", "无需说明", "标“优化处理”"], "answer": "A", "exp": "CZ 为人工制造（人造宝石），必须如实标注人工属性，不能称“锆石”（宝石锆石是另一种天然矿物）或冒充钻石。", "ref": "标准/商贸", "q_en": null, "opts_en": null}, {"id": "FE01", "cat": "长石族", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "月光石（Moonstone）的蓝色晕彩（冰长石光）源于？", "opts": ["正长石与钠长石叶片状交生对光的散射", "铬致色", "包裹体反射", "变色效应"], "answer": "A", "exp": "月光石由钾长石与钠长石薄层交生，光在叶片界面散射形成蓝色浮动晕彩（adularescence）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "FE02", "cat": "长石族", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "拉长石（Labradorite）的“晕彩”（labradorescence）表现为？", "opts": ["蓝绿橙等多色浮动晕彩", "猫眼亮带", "欧泊式变彩", "星光"], "answer": "A", "exp": "拉长石因内部页理对光衍射干涉呈现蓝绿橙等随角度变化的晕彩（晕彩效应）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "FE03", "cat": "长石族", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "属于长石族宝石的有？（多选）", "opts": ["月光石", "日光石", "拉长石", "天河石"], "answer": ["A", "B", "C", "D"], "exp": "月光石(正长石)、日光石(更长石含赤铁矿)、拉长石、天河石(微斜长石)均属长石族。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "FE04", "cat": "长石族", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "长石族宝石普遍具有？", "opts": ["两组完全解理（夹角近90°）", "八面体解理", "贝壳状断口", "金刚光泽"], "answer": "A", "exp": "长石具两组完全解理（正交长石约90°、斜长石约86–87°），性脆易沿解理裂开。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "FE05", "cat": "长石族", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "日光石（Sunstone）的砂金效应由下列哪种包裹体造成？", "opts": ["赤铁矿/针铁矿鳞片", "金红石针", "气液两相包体", "锆石"], "answer": "A", "exp": "日光石含定向赤铁矿/针铁矿鳞片，反射呈橙红砂金闪烁（aventurescence）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S11", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "紫锂辉石（Kunzite）的致色元素与特征是？", "opts": ["Mn 致色、强三色性、两组解理易裂", "Cr 致色", "Fe 致色", "等轴晶系"], "answer": "A", "exp": "紫锂辉石为锂辉石 Mn 致色变种，强三色性、两组完全解理（脆性大），辐照/加热可改色。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S12", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "金绿宝石（Chrysoberyl）的摩氏硬度约为？", "opts": ["8.5", "7", "9", "6"], "answer": "A", "exp": "金绿宝石硬度8.5（仅次于刚玉与钻石），变种有变石与猫眼；注意它非刚玉。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S13", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列具“猫眼”效应的宝石中，最名贵、可单独称“猫眼”的是？", "opts": ["金绿宝石猫眼（Chrysoberyl cat's eye）", "石英猫眼", "碧玺猫眼", "木变石"], "answer": "A", "exp": "珠宝业中“猫眼”一名通常专指金绿宝石猫眼；其他具猫眼效应的宝石须冠矿物名（如“碧玺猫眼”）。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S14", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "宝石“锆石”与“立方氧化锆(CZ)”的主要区别是？", "opts": ["锆石是天然硅酸盐（四方晶系、强双折射有重影、密度4.6+），CZ是人工氧化锆（立方、均质、密度5.6–6.0）", "两者完全相同", "锆石是非晶质", "CZ 是天然矿物"], "answer": "A", "exp": "锆石 ZrSiO₄（天然、四方、一轴晶、强双折射重影、SG 4.6–4.7）；CZ 为人工 ZrO₂（立方、均质、SG 5.6–6.0）。二者完全不同。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S15", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC"], "diff": "难", "q": "低型锆石（经放射性衰变）的特征是？", "opts": ["趋于非晶化、RI 与密度降低、重影减弱", "强双折射重影明显", "密度>5", "金刚光泽"], "answer": "A", "exp": "低型（变生）锆石因放射性衰变结构破坏，RI 与 SG 降低、双折射减弱近均质；高型锆石才强重影。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S16", "cat": "彩色宝石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列具“强三色性”的宝石有？（多选）", "opts": ["紫锂辉石", "堇青石（Iolite）", "坦桑石", "尖晶石"], "answer": ["A", "B", "C"], "exp": "紫锂辉石、堇青石、坦桑石均为二轴晶、强三色性；尖晶石均质体无多色性。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "S17", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "磷灰石（Apatite）相对容易磨损，因为其摩氏硬度约为？", "opts": ["5", "7", "8", "9"], "answer": "A", "exp": "磷灰石硬度仅约5，低于多数宝石，佩戴易划伤；常呈蓝绿、六方晶系。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S18", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "堇青石（Iolite，俗称“水蓝宝石”）的鉴别关键是？", "opts": ["强三色性（蓝紫/浅蓝/黄褐）且二轴晶", "均质体", "等轴晶系", "密度>4"], "answer": "A", "exp": "堇青石强三色性（蓝紫/浅蓝/黄褐）是区分蓝宝石等的关键；二轴晶、RI 1.54–1.55。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "S19", "cat": "彩色宝石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "榍石（Sphene/Titanite）的突出特征是？", "opts": ["高 RI(1.90–2.05)、强双折射与火彩、油脂-金刚光泽", "均质体", "硬度9", "非晶质"], "answer": "A", "exp": "榍石 RI 1.90–2.05、双折射与色散均高、火彩强、油脂-金刚光泽，但硬度低(5–5.5)易损。", "ref": "品种学", "q_en": null, "opts_en": null}, {"id": "FL01", "cat": "荧光与紫外", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "紫外灯“长波”（LWUV）通常指波长约？", "opts": ["365 nm", "254 nm", "100 nm", "500 nm"], "answer": "A", "exp": "长波紫外约365 nm，短波约254 nm；宝石鉴定常用长波观察荧光。", "ref": "仪器", "q_en": null, "opts_en": null}, {"id": "FL02", "cat": "荧光与紫外", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "红宝石在长波紫外下常呈现？", "opts": ["红色荧光（Cr 致）", "绿色荧光", "无荧光", "黄色磷光"], "answer": "A", "exp": "红宝石含 Cr，长波紫外下多显红色荧光，是辅助鉴别点（部分仿品无此特征）。", "ref": "仪器/光学", "q_en": null, "opts_en": null}, {"id": "FL03", "cat": "荧光与紫外", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "宝石荧光强就一定说明是合成或处理品——天然宝石也可有强荧光（如部分钻石、红宝石）。", "opts": ["对", "错"], "answer": "错", "exp": "荧光强弱与天然/合成无必然对应：许多天然钻石、红宝石荧光很强；须结合其他特征判定。", "ref": "光学", "q_en": null, "opts_en": null}, {"id": "FL04", "cat": "荧光与紫外", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "“磷光”是指？", "opts": ["关闭激发光源后仍持续发光的余辉", "可见光下的反光", "荧光的一种别称", "变彩"], "answer": "A", "exp": "磷光是激发停止后延迟发光（余辉），如某些合成钻石、部分方柱石具明显磷光。", "ref": "光学", "q_en": null, "opts_en": null}, {"id": "FL05", "cat": "荧光与紫外", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "紫外荧光可用于辅助鉴别的有？（多选）", "opts": ["区分某些天然与合成钻石（合成常强荧光/磷光）", "红宝石与部分仿品", "象牙与骨（骨常发荧光）", "直接测定折射率"], "answer": ["A", "B", "C"], "exp": "荧光用于辅助区分合成/天然钻石、红宝石与仿品、象牙与骨等；不能测折射率。", "ref": "仪器", "q_en": null, "opts_en": null}, {"id": "BI01", "cat": "双折射率", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "双折射率（Birefringence）的计算是？", "opts": ["两主折射率之差（|最高RI−最低RI|）", "折射率与密度的比", "色散值", "硬度差"], "answer": "A", "exp": "双折射率=两主折射率之差（一轴晶 |Ne−No|，二轴晶 Ng−Np）；值越大、10× 下后刻面棱重影越明显。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "BI02", "cat": "双折射率", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "10× 放大镜下“后刻面棱重影”现象说明该宝石？", "opts": ["具明显双折射（非均质且双折射较高）", "均质体", "非晶质", "无解理"], "answer": "A", "exp": "后刻面棱重影由强双折射造成（如锆石、榍石、碧玺、莫桑石）；均质体无重影。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "BI03", "cat": "双折射率", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "均质体宝石（等轴晶系与非晶质）双折射率为 0，不会出现后刻面棱重影。", "opts": ["对", "错"], "answer": "对", "exp": "均质体光性各向同性、双折射率0，故无后刻面棱重影；重影仅见于非均质双折射宝石。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "BI04", "cat": "双折射率", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列仿钻中，因强双折射在 10× 下可见明显后刻面棱重影的是？", "opts": ["莫桑石（合成碳化硅，Δ≈0.043）与合成金红石", "立方氧化锆", "钇铝榴石(YAG)", "玻璃"], "answer": "A", "exp": "莫桑石、合成金红石为强双折射非均质，10× 重影明显；CZ、YAG、玻璃均质无重影。", "ref": "钻石鉴别", "q_en": null, "opts_en": null}, {"id": "BI05", "cat": "双折射率", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列双折射率较高、10× 易见重影的宝石有？（多选）", "opts": ["锆石", "榍石", "碧玺", "尖晶石"], "answer": ["A", "B", "C"], "exp": "锆石、榍石、碧玺双折射率较高，10× 可见后刻面棱重影；尖晶石均质体无。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "IN01", "cat": "大型仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "鉴别翡翠 B 货（酸洗注胶）最常用的谱学方法是？", "opts": ["红外光谱（FTIR）见有机质吸收峰", "紫外-可见吸收光谱", "拉曼光谱测硬度", "X 射线衍射测密度"], "answer": "A", "exp": "B 货注胶在红外光谱出现明显的 C–H/O–H 有机质吸收峰，是鉴定充填树脂的经典方法。", "ref": "大型仪器", "q_en": null, "opts_en": null}, {"id": "IN02", "cat": "大型仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "无损判断祖母绿是否注油，常用？", "opts": ["红外/拉曼光谱检测裂隙中有机物", "测硬度", "称重", "看颜色"], "answer": "A", "exp": "红外/拉曼可无损检出裂隙中的油/树脂等有机物，判断注油或重度充填处理。", "ref": "大型仪器", "q_en": null, "opts_en": null}, {"id": "IN03", "cat": "大型仪器", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列属“大型无损检测仪器”的有？（多选）", "opts": ["拉曼光谱仪", "红外光谱仪(FTIR)", "X 射线荧光仪(XRF)", "10× 放大镜"], "answer": ["A", "B", "C"], "exp": "拉曼、红外、XRF 为实验室大型/无损仪器；10× 放大镜是常规便携工具，非大型仪器。", "ref": "大型仪器", "q_en": null, "opts_en": null}, {"id": "IN04", "cat": "大型仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "X 射线荧光（XRF）主要用于？", "opts": ["无损测定宝石的元素成分（主量/微量）", "测折射率", "测密度", "观察荧光"], "answer": "A", "exp": "XRF 通过特征 X 射线无损分析元素组成，用于区分相似外观宝石、查染色/处理元素。", "ref": "大型仪器", "q_en": null, "opts_en": null}, {"id": "IN05", "cat": "大型仪器", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "拉曼光谱（Raman）鉴别宝石的主要原理是？", "opts": ["不同物相有特征分子振动峰，可无损区分天然/合成/仿品与包裹体", "测硬度", "测密度", "测色散"], "answer": "A", "exp": "拉曼基于分子振动指纹峰，非接触无损，可鉴定物相、区分天然/合成/仿品并分析包裹体成分。", "ref": "大型仪器", "q_en": null, "opts_en": null}, {"id": "CU01", "cat": "切工比例", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "标准圆钻明亮式切工的台宽比约为？", "opts": ["53%–57%（常取57%）", "30%", "80%", "10%"], "answer": "A", "exp": "理想圆钻台宽约53–57%（Tolkowsky 取57%），冠角约34.5°、亭深约43%、全深约61%。", "ref": "钻石分级", "q_en": null, "opts_en": null}, {"id": "CU02", "cat": "切工比例", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "圆钻“鱼眼效应”（fish-eye）通常因？", "opts": ["亭部过浅，腰围内侧反射形成白环", "亭部过深", "台面太小", "抛光差"], "answer": "A", "exp": "亭部过浅时，从台面可见腰围的反射白环（鱼眼）；比例不良导致漏光、美观与价值下降。", "ref": "钻石切工", "q_en": null, "opts_en": null}, {"id": "CU03", "cat": "切工比例", "type": "single", "exams": ["GIC", "NGTC"], "diff": "中", "q": "圆钻“黑底/钉头效应”（nail-head）通常因？", "opts": ["亭部过深，光线从底尖漏出显暗", "亭部过浅", "冠角过大", "荧光强"], "answer": "A", "exp": "亭部过深使入射光从底尖漏出，台面中心显暗（黑底）；与鱼眼相反，均属比例失调。", "ref": "钻石切工", "q_en": null, "opts_en": null}, {"id": "CU04", "cat": "切工比例", "type": "judge", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "钻石切工比例（台宽、冠角、亭深等）直接影响亮度与火彩，比例不良会漏光降低价值，属 4C 中的 Cut。", "opts": ["对", "错"], "answer": "对", "exp": "切工比例与对称性、抛光共同决定光线表现，是 4C 中 Cut 的核心，显著影响美观与价格。", "ref": "钻石分级", "q_en": null, "opts_en": null}, {"id": "CU05", "cat": "切工比例", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "理想圆钻明亮式切工考虑的比例要素有？（多选）", "opts": ["台宽比", "冠角与亭深比", "腰厚与对称性", "产地"], "answer": ["A", "B", "C"], "exp": "切工评估含台宽、冠高、亭深、腰厚、底尖、对称性等；产地不属切工要素。", "ref": "钻石分级", "q_en": null, "opts_en": null}, {"id": "O11", "cat": "光学与颜色", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "宝石“透明度”通常分为？", "opts": ["透明/半透明/微透明/不透明", "仅透明与不透明", "按颜色分", "按硬度分"], "answer": "A", "exp": "透明度分透明、半透明、微透明（半透）、不透明四级，影响外观与价值评估。", "ref": "光学性质", "q_en": null, "opts_en": null}, {"id": "O12", "cat": "光学与颜色", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "刚玉的“裂理”（parting）与“解理”的主要区别是？", "opts": ["裂理沿双晶面或定向裂隙裂开（非真正解理面），解理沿晶体结构固定薄弱面", "两者完全相同", "解理只存在于钻石", "裂理比解理更完全"], "answer": "A", "exp": "裂理沿双晶接合面/应力面裂开（如刚玉底面裂理），非晶体固有薄弱面；解理沿固定晶面（如钻石八面体解理）。", "ref": "力学性质", "q_en": null, "opts_en": null}, {"id": "O13", "cat": "光学与颜色", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "关于宝石包裹体的成因分类，正确的有？（多选）", "opts": ["原生包裹体（与宿主同时形成，如金红石针）", "次生包裹体（后生，如裂隙充填物）", "假次生包裹体（原生但沿裂隙分布，如气液）", "包裹体均为人工处理造成"], "answer": ["A", "B", "C"], "exp": "包裹体按成因分原生、次生、假次生；均为自然形成（或天然/合成生长过程），非人工处理。", "ref": "包裹体", "q_en": null, "opts_en": null}, {"id": "B07", "cat": "祖母绿绿柱石", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "以“木佐（Muzo）”艳绿色祖母绿闻名的著名产地是？", "opts": ["哥伦比亚", "澳大利亚", "南非", "日本"], "answer": "A", "exp": "哥伦比亚（木佐、契沃尔等矿区）产顶级艳绿祖母绿，常具三相包裹体，市场溢价高。", "ref": "品种学/商贸", "q_en": null, "opts_en": null}, {"id": "B08", "cat": "祖母绿绿柱石", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "关于祖母绿产地，下列说法正确的有？（多选）", "opts": ["哥伦比亚祖母绿常见三相（气-液-固）包裹体", "赞比亚祖母绿常含云母、颜色偏蓝绿", "巴西也产祖母绿", "产地不影响任何价值"], "answer": ["A", "B", "C"], "exp": "哥伦比亚（三相包体）、赞比亚（含云母、蓝绿）、巴西等均产祖母绿；名优产地（如木佐）显著溢价。", "ref": "品种学/商贸", "q_en": null, "opts_en": null}, {"id": "SA10", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "简述拼合石的鉴别要点与定名规则。", "opts": null, "answer": "鉴别：①侧面/腰围观察结合缝、胶层（浸二碘甲烷因各部分 RI 不同使结合面清晰）；②不同层光泽/颜色/荧光可能差异；③显微镜见接合面气泡或胶；④大型仪器（如层状结构）。\n定名：GB/T 16552 要求标“拼合”及组成材料（如“拼合欧泊”“拼合祖母绿”），隐瞒充当天然单晶属欺诈。", "exp": "标准/拼合石", "ref": null, "q_en": null, "opts_en": null}, {"id": "SA11", "cat": "简答综合", "type": "short", "exams": ["GIC", "NGTC", "FGA"], "diff": "难", "q": "简述红外光谱(FTIR)、拉曼光谱、X 射线荧光(XRF)在宝石鉴定中的典型应用。", "opts": null, "answer": "①红外光谱(FTIR)：检测分子振动，识别充填有机物（翡翠 B 货胶、祖母绿注油/树脂）、水与 CO₂，区分天然/合成与处理。②拉曼光谱：分子振动指纹，非接触无损鉴定物相、区分天然/合成/仿品、分析包裹体成分。③XRF：特征 X 射线无损测定元素组成（主量/微量），用于区分相似外观宝石、筛查染色/处理元素（如钴染）。三者均属大型无损检测，弥补常规仪器不足。", "exp": "大型仪器", "ref": null, "q_en": null, "opts_en": null}, {"id": "GLO01", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "宝石学中“解理（cleavage）”是指？", "opts": ["晶体受外力沿特定结晶方向（平行于某组晶面、键力较弱方向）平整裂开的性质", "晶体任意方向受击形成的随机不规则断面", "宝石表面因磨损产生的划痕", "宝石内部的天然色斑"], "answer": "A", "exp": "解理是晶体沿特定结晶方向（平行某组晶面、结构中键力较弱的方向）规则、平整裂开的性质，方向性强。如钻石的八面体完全解理、云母的极完全解理、刚玉的底面裂理。与“断口”相对。", "ref": "力学性质/《系统宝石学》", "q_en": null, "opts_en": null}, {"id": "GLO02", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "下列关于“断口（fracture）”的描述，正确的是？", "opts": ["断口是沿晶体特定方向规则裂开", "断口是晶体受击后不沿固定方向、呈不规则形态的破裂面（如贝壳状、锯齿状）", "断口只见于钻石", "断口等同于解理"], "answer": "B", "exp": "断口是不沿晶体特定方向、呈不规则形态的破裂面，常见类型有贝壳状（石英、玻璃）、锯齿状、平坦状等。无解理或解理不发育的宝石常以断口为主要破裂特征。", "ref": "力学性质", "q_en": null, "opts_en": null}, {"id": "GLO03", "cat": "基础名词解释", "type": "multiple", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "关于“解理”与“断口”，下列说法正确的有？（多选）", "opts": ["解理沿晶体特定方向（晶面方向）裂开，具方向性", "断口不具方向性，形态不规则", "钻石具八面体完全解理", "石英无解理，常见贝壳状断口"], "answer": ["A", "B", "C", "D"], "exp": "解理方向性明显、断口不规则；钻石八面体完全解理，石英无解理常呈贝壳状断口。两者是描述宝石受力破裂方式的相对概念。", "ref": "力学性质", "q_en": null, "opts_en": null}, {"id": "GLO04", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "摩氏硬度（Mohs hardness）反映的是宝石的哪类性质？", "opts": ["抗刻划能力（相对硬度）", "抗破碎的韧性", "密度大小", "折射率高低"], "answer": "A", "exp": "摩氏硬度是相对刻划硬度，表示一种矿物能否刻划另一种（金刚石10最硬、滑石1最软）。注意硬度≠韧性（如钻石硬但韧度中等）。", "ref": "力学性质", "q_en": null, "opts_en": null}, {"id": "GLO05", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列说法正确的是？", "opts": ["硬度越高的宝石韧性一定越好", "硬度是抗刻划能力，韧性是抗破损（抗冲击/撕裂）能力，二者不同", "托帕石硬度低所以韧性差", "钻石硬度最高故韧性也最高"], "answer": "B", "exp": "硬度（抗刻划）与韧性（抗破损）是不同概念：钻石硬度最高（10）但因解理而韧度中等；软玉硬度不高却因交织结构韧性极佳。", "ref": "力学性质", "q_en": null, "opts_en": null}, {"id": "GLO06", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "宝石的“相对密度（SG，旧称比重）”是指？", "opts": ["宝石质量与同体积 4℃ 水质量之比", "宝石体积与质量之比", "折射率与密度的比值", "硬度与密度的乘积"], "answer": "A", "exp": "相对密度（specific gravity）= 宝石在空气中的质量 / 同体积 4℃ 水的质量，常用静水力学法或重液法测定，是重要鉴别参数（如钻石 3.52、CZ 5.6–6.0）。", "ref": "密度与比重", "q_en": null, "opts_en": null}, {"id": "GLO07", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "宝石学中“折射率（RI）”是指？", "opts": ["光在真空与在宝石中传播速度之比（n = c / v）", "宝石的密度与水的比值", "宝石的硬度等级", "光的波长"], "answer": "A", "exp": "折射率 n = 真空中光速 / 宝石中光速 = sin i / sin r，是光进入宝石偏折程度的度量，由折射仪测量。均质体单折射、非均质体双折射。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "GLO08", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "宝石学中“双折射率（birefringence，DR）”是指？", "opts": ["宝石最高折射率与最低折射率之差", "折射率与密度的乘积", "两种宝石折射率的平均值", "折射率的平方"], "answer": "A", "exp": "双折射率 Δn = 最高主折射率 − 最低主折射率。等轴晶系单晶与非晶质为单折射（Δn = 0）；非均质体才有双折射。双折射率大者（如锆石、方解石）底刻面棱易见“重影”，是区分仿钻的重要依据。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "GLO09", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列哪种现象是“双折射”在宝石中的直观表现？", "opts": ["透过宝石可见底刻面棱呈双重影像（后刻面棱重影）", "宝石整体颜色变深", "硬度增加", "密度降低"], "answer": "A", "exp": "非均质体双折射使光线分成两束、传播速度不同，导致底刻面棱出现“重影”。强双折射（锆石、方解石）重影明显；等轴晶系（钻石、CZ）无重影。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "GLO10", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "下列关于“均质体”与“非均质体”的说法，正确的是？", "opts": ["等轴晶系（如钻石、石榴石）与所有非晶质体为均质体，光学性质各方向相同", "三方晶系宝石为均质体", "非均质体只有一个折射率", "均质体在偏光镜下全亮"], "answer": "A", "exp": "均质体 = 等轴晶系单晶 + 非晶质，各方向光学性质相同（单折射，偏光镜下全暗）；非均质体 = 中级/低级晶族，具双折射（一轴/二轴晶），偏光镜下四明四暗。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "GLO11", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "“一轴晶”和“二轴晶”分别对应哪些晶系？", "opts": ["一轴晶 = 三方/四方/六方；二轴晶 = 斜方/单斜/三斜", "一轴晶 = 等轴晶系；二轴晶 = 非晶质", "一轴晶 = 斜方；二轴晶 = 三方", "一轴晶 = 非晶质；二轴晶 = 等轴晶系"], "answer": "A", "exp": "中级晶族（三方、四方、六方）为一轴晶（两个主折射率）；低级晶族（斜方、单斜、三斜）为二轴晶（三个主折射率）；等轴晶系与非晶质为均质体。", "ref": "晶体光学", "q_en": null, "opts_en": null}, {"id": "GLO12", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "宝石的“多色性（pleochroism）”是指？", "opts": ["非均质体因光性方向不同而在不同观察方向呈现不同颜色的现象", "宝石表面反射出的多种色彩", "荧光导致的颜色变化", "加热后颜色改变"], "answer": "A", "exp": "多色性是非均质体（尤其二轴晶与强一轴晶，如堇青石、坦桑石、红蓝宝）因不同振动方向吸收不同，从不同方向观察呈现不同颜色，是二色镜观察内容，可辅助鉴定。", "ref": "颜色成因/晶体光学", "q_en": null, "opts_en": null}, {"id": "GLO13", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "宝石的“色散（dispersion）”是指？", "opts": ["白光因各色光折射率不同而分解成彩色的现象（产生“火彩”）", "宝石对光的吸收能力", "宝石的密度", "宝石的硬度"], "answer": "A", "exp": "色散是宝石将白光分解为组成色光（火彩）的能力，源于折射率随波长变化。色散越强火彩越明显（钻石、CZ、钛酸锶）。色散值如钻石 0.044。", "ref": "光学性质", "q_en": null, "opts_en": null}, {"id": "GLO14", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "宝石学中“光泽（lustre）”是指？", "opts": ["宝石表面对光的反射能力（视觉上的反光质感）", "宝石内部的颜色", "宝石的透明度", "宝石的密度"], "answer": "A", "exp": "光泽是宝石表面反射光线的能力与视觉感受，取决于折射率与表面平整度。类型：金刚光泽（钻石）、玻璃光泽（多数宝石）、油脂光泽（软玉）、丝绢光泽（纤维集合体）、树脂光泽（琥珀）、珍珠光泽等。", "ref": "光学性质", "q_en": null, "opts_en": null}, {"id": "GLO15", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "易", "q": "宝石的“透明度（transparency）”是指？", "opts": ["宝石允许可见光透过的程度", "宝石反射光的能力", "宝石的密度", "宝石的硬度"], "answer": "A", "exp": "透明度是宝石透过可见光的能力，分透明、半透明、微透明、不透明，受厚度、颜色、内含物影响，是商贸与鉴定描述项。", "ref": "光学性质", "q_en": null, "opts_en": null}, {"id": "GLO16", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC", "FGA"], "diff": "中", "q": "宝石学中的“包裹体（inclusion）”是指？", "opts": ["宝石内部包含的矿物晶体、气液、裂隙等天然或人为异物", "宝石表面的划痕", "宝石的外部形状", "宝石的折射率"], "answer": "A", "exp": "包裹体是宝石内部（或表面）的固/液/气三相异物，包括矿物包体、气液包体、生长纹、裂隙等，可指示天然性、成因与产地（如哥伦比亚三相包体），也是区分天然/合成/处理的关键证据。", "ref": "包裹体学", "q_en": null, "opts_en": null}, {"id": "GLO17", "cat": "基础名词解释", "type": "single", "exams": ["GIC", "NGTC" function render(){

        let en=''; if(q.opts_en && q.opts_en[i]) en='<span class="en">'+escapeHtml(q.opts_en[i])+'</span>';

      });
      html+='</ul>';
    }
    html+='<button class="ansbtn" onclick="reveal('+idx+')">显示答案</button>';
    let expHtml='<div class="exp" id="exp'+idx+'">';
    const ansText = Array.isArray(q.answer)? q.answer.join('、') : q.answer;
    expHtml+='<div><b>答案：</b>'+escapeHtml(ansText)+'</div>';

function correctLetters(q){
  if(q.type==='multiple') return Array.isArray(q.answer)? q.answer.slice() : String(q.answer).split('');
  if(q.type==='judge') return [ q.answer==='对'?'A':'B' ];
  return [q.answer];
}
function pick(li,idx,i){ li.classList.add('sel'); }
function reveal(idx){
  const exp=document.getElementById('exp'+idx);
  if(revealState[idx]){ exp.classList.remove('show'); revealState[idx]=false; return; }
  exp.classList.add('show'); revealState[idx]=true;
  const lis=exp.parentNode.querySelectorAll('.opts li');
  const cl=correctLetters(DATA[idx]);
  lis.forEach((li,k)=>{ if(cl.includes(optLetter(k))) li.classList.add('correct'); });
}
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
['fExam','fCat','fType','fDiff'].forEach(function(id){document.getElementById(id).addEventListener('change',render);});
document.getElementById('fSearch').addEventListener('input',render);
document.getElementById('revealAll').addEventListener('click',function(){
  DATA.forEach(function(q,idx){ const exp=document.getElementById('exp'+idx); if(!exp) return;
    exp.classList.add('show'); revealState[idx]=true;
    const lis=exp.parentNode.querySelectorAll('.opts li');
    const cl=correctLetters(q);
    lis.forEach(function(li,k){ if(cl.includes(optLetter(k))) li.classList.add('correct'); });
  });
});
render();
</script>
</body>
